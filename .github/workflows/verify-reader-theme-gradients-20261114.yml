name: Verify reader theme and compact gradients

on:
  pull_request:
    branches:
      - feat/private-books-recipient-preview-20261114
    paths:
      - 'molitvoslov-app/**'
      - '.github/workflows/verify-reader-theme-gradients-20261114.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reader-theme:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: molitvoslov-app/package-lock.json
      - name: Verify Bible colours, chapter stability and compact reading gradient
        working-directory: molitvoslov-app
        run: node tools/test_reader_theme_gradient_sync_20261114.js
      - name: Regression tests for content share links and private book imports
        working-directory: molitvoslov-app
        run: |
          node tools/test_shared_content_links_20261113.js
          node tools/test_private_book_share_recipient_20261114.js
      - name: Install Expo dependencies
        working-directory: molitvoslov-app
        run: |
          npm ci --ignore-scripts
          npx patch-package
      - name: Bundle Android and validate JS / JSX
        working-directory: molitvoslov-app
        run: npx expo export --platform android --output-dir /tmp/reader-theme-android
