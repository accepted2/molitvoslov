name: Calendar HD icon pipeline safeguards
on:
  push:
    paths:
      - 'molitvoslov-backend/api/calendar_icon_variants.py'
      - 'molitvoslov-backend/api/management/commands/audit_calendar_icons.py'
      - 'molitvoslov-backend/api/tests_calendar_icon_variants.py'
      - '.github/workflows/calendar-hd-icons.yml'
  pull_request:
    paths:
      - 'molitvoslov-backend/api/calendar_icon_variants.py'
      - 'molitvoslov-backend/api/management/commands/audit_calendar_icons.py'
      - 'molitvoslov-backend/api/tests_calendar_icon_variants.py'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install only icon pipeline dependencies
        run: python -m pip install 'Django==6.1' 'Pillow>=10,<13'
      - name: Test aspect ratio, original preservation, public URLs
        working-directory: molitvoslov-backend
        run: python -m unittest api.tests_calendar_icon_variants -v
