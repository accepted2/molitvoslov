name: Verify sharing APIs for Render

on:
  pull_request:
    branches:
      - fix/search-result-focus-language
    paths:
      - 'molitvoslov-backend/**'
      - '.github/workflows/verify-private-share-server-20261114.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-shared-private-content:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SUPABASE_DB_PASSWORD: ''
      DEBUG: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: molitvoslov-backend/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r molitvoslov-backend/requirements.txt
      - name: Check migration and data-independent share import tests
        working-directory: molitvoslov-backend
        run: |
          python -m compileall -q api
          python manage.py check
          python manage.py shell -c "from django.urls import resolve; assert resolve('/api/shared/create/').url_name == 'shared-create'; assert resolve('/api/shared/test-token/import/').url_name == 'shared-import'; assert resolve('/api/shared/test-token/photo/0/').url_name == 'shared-photo'"
          python manage.py makemigrations --check --dry-run
          python manage.py migrate --noinput
          python manage.py test api.test_shared_content --verbosity 2
