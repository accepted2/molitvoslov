name: Verify phone APK sources and 17 lossless WebP images

on:
  pull_request:
    branches:
      - fix/reader-theme-gradient-sync-20261114
    paths:
      - 'molitvoslov-app/**'
      - '.github/workflows/verify-phone-webp-20261114.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-webp-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: molitvoslov-app/package-lock.json
      - name: Install image verification dependency
        run: python -m pip install Pillow
      - name: Convert only referenced home and Evangelist images to pixel-perfect WebP
        working-directory: molitvoslov-app
        run: |
          python tools/test_webp_lossless_20261113.py
          python tools/prepare_webp_lossless_20261113.py --apply
          python tools/prepare_webp_lossless_20261113.py --check
          python tools/verify_phone_webp_assets_20261114.py
      - name: Verify version, reader styles and shared books
        working-directory: molitvoslov-app
        run: |
          python -c "import json; x=json.load(open('app.json',encoding='utf8'))['expo']; assert (x['version'],x['android']['versionCode'])==('1.0.31',32)"
          node tools/test_reader_theme_gradient_sync_20261114.js
          node tools/test_private_book_share_recipient_20261114.js
      - name: Install JS dependencies and patches
        working-directory: molitvoslov-app
        run: |
          npm ci --ignore-scripts
          npx patch-package
      - name: Export optimized Android JS and verify 17 WebP files in bundle
        working-directory: molitvoslov-app
        run: |
          npx expo export --platform android --output-dir /tmp/molitvoslov-phone-webp
          python tools/verify_phone_webp_assets_20261114.py --export-dir /tmp/molitvoslov-phone-webp
