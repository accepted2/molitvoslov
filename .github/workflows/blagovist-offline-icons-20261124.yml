name: Build offline Blagovist calendar icons

on:
  push:
    branches:
      - integration/snapshot-calendar-20261124
    paths:
      - .github/scripts/install_blagovist_offline_icons_20261124.py
      - .github/workflows/blagovist-offline-icons-20261124.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: offline-blagovist-icon-replacement
  cancel-in-progress: false

jobs:
  package-icons:
    name: Download, verify, replace and commit local icon assets
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: false
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install image tools
        run: python -m pip install --disable-pip-version-check 'Pillow>=11,<13' 'requests>=2.32,<3'
      - name: Compile and smoke-test source image fetching
        run: |
          python -m py_compile .github/scripts/install_blagovist_offline_icons_20261124.py
          python -u .github/scripts/install_blagovist_offline_icons_20261124.py --probe
      - name: Replace obsolete local icon files with vetted Blagovist images
        run: python -u .github/scripts/install_blagovist_offline_icons_20261124.py
      - name: Verify local-only image references, hashes and deduplication
        run: python .github/scripts/install_blagovist_offline_icons_20261124.py --verify-only
      - name: Commit replacement (no source JSON, texts or remote endpoints modified)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- molitvoslov-app/assets/calendar-icons molitvoslov-app/src/data/calendarIconAssets.js molitvoslov-app/src/data/calendarIconOfflineAudit.json
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Icon library already up to date"
          else
            git commit -m "assets(calendar): replace Azbyka icon files with deduplicated offline Blagovist WebP"
            # Work on the isolated CI checkout, not on the user's dirty worktree.
            # Carry the icon-only commit onto any newer frontend commits.
            git fetch origin integration/snapshot-calendar-20261124
            git rebase origin/integration/snapshot-calendar-20261124
            git push origin HEAD:integration/snapshot-calendar-20261124
          fi
