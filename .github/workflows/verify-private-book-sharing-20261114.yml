name: Verify personal memorial and prayer book sharing

on:
  pull_request:
    branches:
      - fix/unified-share-actions-bible19-20261114
    paths:
      - 'molitvoslov-backend/**'
      - 'molitvoslov-app/**'
      - '.github/workflows/verify-private-book-sharing-20261114.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-shared-private-content:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_DB_PASSWORD: ''
      DEBUG: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: molitvoslov-backend/requirements.txt
      - name: Install backend requirements
        run: python -m pip install -r molitvoslov-backend/requirements.txt
      - name: Verify schema, view imports and copy-by-link behavior
        working-directory: molitvoslov-backend
        run: |
          python -m compileall -q api
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py test api.test_shared_content --verbosity 2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run direct-link and private book client tests
        working-directory: molitvoslov-app
        run: |
          node tools/test_shared_content_links_20261113.js
          node tools/test_private_book_share_recipient_20261114.js
          node tools/test_android_app_links_20261113.js
      - name: Install Expo dependencies
        working-directory: molitvoslov-app
        run: |
          npm ci --ignore-scripts
          npx patch-package
      - name: Export Android JS bundle and check JSX
        working-directory: molitvoslov-app
        run: npx expo export --platform android --output-dir /tmp/private-sharing-android
