name: Akathist content import safety checks

on:
  push:
    branches:
      - feature/global-reader-settings-sync-20261109
    paths:
      - 'molitvoslov-backend/api/management/commands/audit_akathist_epubs.py'
      - 'molitvoslov-backend/api/test_audit_akathist_epubs.py'
      - 'molitvoslov-backend/api/management/commands/import_missing_azbyka_catalog.py'
      - 'molitvoslov-backend/api/test_import_missing_azbyka_catalog.py'
      - 'molitvoslov-backend/api/management/commands/stage_azbyka_cs_preview.py'
      - 'molitvoslov-backend/api/test_stage_azbyka_cs_preview.py'
      - 'molitvoslov-app/tools/preview_new_cs_akathists_20261109.ps1'
      - 'molitvoslov-app/tools/azbyka_akathist_batch.py'
      - '.github/workflows/epub-akathist-audit-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: molitvoslov-backend/requirements.txt
      - name: Install Django backend dependencies
        run: python -m pip install -r molitvoslov-backend/requirements.txt
      - name: Check Django and verify EPUB/catalog safe importers
        working-directory: molitvoslov-backend
        run: |
          python manage.py check
          python manage.py test api.test_audit_akathist_epubs api.test_import_missing_azbyka_catalog api.test_stage_azbyka_cs_preview --verbosity 2
      - name: Test safe additive offline preview merge
        working-directory: molitvoslov-app/tools
        run: python test_azbyka_akathist_batch.py
      - name: Syntax-check the local PowerShell installer
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("molitvoslov-app/tools/preview_new_cs_akathists_20261109.ps1", [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -ne 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
      - name: Set up Node for bundled app catalogue verification
        uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - name: Install mobile verifier dependencies
        working-directory: molitvoslov-app
        run: npm ci --ignore-scripts
      - name: Verify published akathist list in APK offline JSON
        working-directory: molitvoslov-app
        run: node tools/verify_akathist_content.js
