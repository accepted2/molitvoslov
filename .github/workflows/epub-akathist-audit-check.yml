name: Akathist EPUB no-write audit

on:
  push:
    branches:
      - feature/global-reader-settings-sync-20261109
    paths:
      - 'molitvoslov-backend/api/management/commands/audit_akathist_epubs.py'
      - 'molitvoslov-backend/api/test_audit_akathist_epubs.py'
      - '.github/workflows/epub-akathist-audit-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: molitvoslov-backend/requirements.txt
      - name: Install Django backend dependencies
        run: python -m pip install -r molitvoslov-backend/requirements.txt
      - name: Check Django and test read-only EPUB structure extraction
        working-directory: molitvoslov-backend
        run: |
          python manage.py check
          python manage.py test api.test_audit_akathist_epubs --verbosity 2
