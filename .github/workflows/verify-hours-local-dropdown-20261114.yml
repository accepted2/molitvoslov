name: Verify First Hour offline fallback and prayer-only menus

on:
  pull_request:
    branches:
      - fix/reader-theme-gradient-sync-20261114
    paths:
      - 'molitvoslov-app/**'
      - '.github/workflows/verify-hours-local-dropdown-20261114.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hours-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: molitvoslov-app/package-lock.json
      - name: First Hour backup, historical import and prayer-only menus
        working-directory: molitvoslov-app
        run: |
          node tools/test_hours_local_first_dropdown_actions_20261114.js
          node tools/test_hours_first_hour_editorial.js
          node tools/test_hours_first_hour_russian.js
          node tools/test_first_hour_traditional_text.js
          node tools/test_first_hour_traditional_rubrics.js
      - name: Verify ALL release-script regression tests before building APK
        working-directory: molitvoslov-app
        run: |
          node tools/test_vertical_actions_calendar_favorites_20261113.js
          node tools/test_calendar_public_share_20261113.js
          node tools/test_saint_shared_link_recovery_20261113.js
          node tools/test_unified_share_actions_20261114.js
          node tools/test_share_bible_saint_photo_20261113.js
          node tools/test_shared_content_links_20261113.js
          node tools/test_dual_share_release_20261113.js
          node tools/test_bible_lists_actions_20261113.js
          node tools/test_psalter_context_share_font_20261113.js
          node tools/test_bible_crossrefs_appearance_bookmarks_20261113.js
          node tools/test_android_app_links_20261113.js
          node tools/test_crossrefs_private_list_sharing_20261113.js
      - name: Parse Windows release and source-overlay PowerShell scripts
        shell: pwsh
        working-directory: molitvoslov-app
        run: |
          foreach ($name in @("tools/overlay-latest-on-working-android-20261114.ps1", "tools/build-release-and-smoke-20261113.ps1")) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $name).Path, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count) {
              $parseErrors | ForEach-Object { Write-Error $_.Message }
              exit 1
            }
            Write-Host "PASS PowerShell parser: $name"
          }
      - name: Install Expo dependencies
        working-directory: molitvoslov-app
        run: |
          npm ci --ignore-scripts
          npx patch-package
      - name: Export Android JS to catch JSX and WebView runtime issues
        working-directory: molitvoslov-app
        run: npx expo export --platform android --output-dir /tmp/molitvoslov-hours-fix
