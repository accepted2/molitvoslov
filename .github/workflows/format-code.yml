name: Format source code

on:
  push:
    branches:
      - main
    paths:
      - "molitvoslov-app/**/*.js"
      - "molitvoslov-app/**/*.jsx"
      - "molitvoslov-app/**/*.ts"
      - "molitvoslov-app/**/*.tsx"
      - "molitvoslov-app/**/*.json"
      - "molitvoslov-backend/**/*.py"
      - ".prettierrc.json"
      - ".prettierignore"
      - ".editorconfig"
      - "pyproject.toml"
      - ".github/workflows/format-code.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20.19.4"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Format React Native source
        run: |
          npx --yes prettier@3.6.2 --write             "molitvoslov-app/**/*.{js,jsx,ts,tsx,json,md}"             --ignore-path .prettierignore

      - name: Install Black
        run: python -m pip install black==25.9.0

      - name: Format Django source
        run: black molitvoslov-backend

      - name: Check whitespace
        run: git diff --check

      - name: Verify Python syntax
        run: python -m compileall -q molitvoslov-backend

      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No formatting changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add             molitvoslov-app             molitvoslov-backend             .prettierrc.json             .prettierignore             .editorconfig             pyproject.toml

          git commit -m "Format project source code"
          git pull --rebase origin main
          git push origin HEAD:main
